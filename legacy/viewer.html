<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OGF Viewer</title>
<link rel="stylesheet" href="viewer.css">
</head>
<body>
<aside id="side">
  <h1>OGF Viewer <small>X-Ray Engine</small></h1>
  <section>
    <h2>1. Игра / формат</h2>
    <select id="fmtSel" class="wide"></select>
    <div id="fmtHint" class="hint"></div>
  </section>
  <section id="secArch">
    <h2>2. Папка или архивы игры</h2>
    <div class="row"><button id="btnFolder">Папка игры…</button><button id="btnArch">Открыть .bsa…</button></div>
    <div id="archInfo" class="hint"></div>
    <input id="archFilter" class="wide" placeholder="Поиск модели в архивах (например: sword)">
    <select id="archList" size="8"></select>
  </section>
  <section>
    <h2 id="hModel">2. Модель</h2>
    <div class="row">
      <button id="btnModel" class="primary">Выбрать модель…</button>
      <button id="btnOmf">+ .omf</button>
    </div>
  </section>
  <section>
    <h2>3. Текстуры</h2>
    <div class="row">
      <button id="btnTex">Файлы…</button>
      <button id="btnTexDir">Папка…</button>
    </div>
  </section>
  <div id="status" class="status">Выберите игру или формат, затем модель (или перетащите файлы в окно).</div>

  <section><h2>Сведения</h2><div id="info" class="info">—</div></section>
  <section><h2>Меши и текстуры</h2><div id="meshList"></div></section>
  <section>
    <h2>Анимация</h2>
    <select id="motionSel" size="7"></select>
    <div class="row">
      <button id="btnPlay">⏸</button>
      <input id="rngTime" type="range" min="0" max="1000" value="0">
      <span id="lblTime">0.00 / 0.00</span>
    </div>
    <label>Скорость <input id="rngSpeed" type="range" min="0.1" max="3" step="0.1" value="1"> <span id="lblSpeed">1.0×</span></label>
    <label><input type="checkbox" id="chkLoop" checked> Зациклить</label>
    <label id="lblInv"><input type="checkbox" id="chkInvQuat"> Инвертировать вращение (подбирается автоматически)</label>
  </section>
  <section>
    <h2>Вид</h2>
    <label><input type="checkbox" id="chkTex" checked> Текстуры</label>
    <label><input type="checkbox" id="chkWire"> Каркас</label>
    <label><input type="checkbox" id="chkSkeleton"> Скелет</label>
    <label><input type="checkbox" id="chkGrid" checked> Сетка</label>
    <label><input type="checkbox" id="chkAlpha"> Альфа-тест (вырезание)</label>
    <label id="lblZup"><input type="checkbox" id="chkZup"> Ось Z вверх (повернуть модель)</label>
    <button id="btnCam">Сбросить камеру</button>
  </section>
  <p class="hint">ЛКМ — вращение, ПКМ / Shift+ЛКМ — сдвиг, колесо — масштаб.</p>
</aside>
<main><canvas id="gl"></canvas><div id="drop">Отпустите файлы</div></main>
<input type="file" id="fileModel" hidden>
<input type="file" id="fileArch" hidden multiple accept=".bsa">
<input type="file" id="fileFolder" hidden webkitdirectory multiple>
<input type="file" id="fileOmf" hidden accept=".omf">
<input type="file" id="fileTex" hidden multiple accept=".dds,.png,.jpg,.jpeg,.bmp,.webp">
<input type="file" id="fileTexDir" hidden webkitdirectory multiple>
<input type="file" id="fileMeshTex" hidden accept=".dds,.png,.jpg,.jpeg,.bmp,.webp">
<script type="module" src="js/main.js"></script>
</body>
</html>
