<!doctype html>
<!-- Пример: gmv на обычной странице без сборщика. Соберите библиотеку (npm run build -w gmv) и откройте файл через локальный сервер. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<title>gmv standalone</title>
<style>html,body{margin:0;height:100%;background:#1e2227;color:#d8dde3;font:13px system-ui}canvas{width:100%;height:calc(100% - 40px);display:block}</style>
</head>
<body>
<div style="padding:8px"><input type="file" id="f" multiple> <span id="st"></span></div>
<canvas id="c"></canvas>
<script src="../dist/gmv.iife.js"></script>
<script>
  // assimpjs для glTF/FBX/OBJ: положите assimpjs.js + .wasm рядом (lib/) или используйте только нативные форматы
  GMV.configureAssimp({ baseUrl: new URL('lib/', location.href).href, scripts: ['assimpjs.js'] });
  const { session } = GMV.mount(document.getElementById('c'));
  session.on('status', (s) => { document.getElementById('st').textContent = s.text; });
  document.getElementById('f').onchange = (e) => session.addFiles(e.target.files);
</script>
</body>
</html>
